url: https://brian-j-moe.github.io/vitalBayes/

template:
  bootstrap: 5
  math-rendering: mathjax
  assets: pkgdown/assets
  light-switch: false
  bslib:
    # Force dark theme
    preset: "shiny"
    bg: "#0D0221"
    fg: "#F0E6FF"
    primary: "#FF1D8E"
    secondary: "#5B3A8F"
    success: "#4ECDC4"
    info: "#00D9FF"
    warning: "#FF6B35"
    danger: "#FF1D8E"
    # Typography
    base_font: {google: "Inter"}
    heading_font: {google: "Orbitron"}
    code_font: {google: "JetBrains Mono"}
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    after_body: |
      <script>
      document.addEventListener('DOMContentLoaded', function() {
        // ===========================================
        // HOMEPAGE TABLE OF CONTENTS GENERATOR
        // Creates a floating TOC for the README homepage
        // ===========================================
        var isHome = document.body.classList.contains('template-home');

        if (isHome) {
          console.log('vitalBayes: Homepage detected, creating TOC...');

          // Find main content - pkgdown uses different selectors
          var mainContent = document.querySelector('.col-md-9') ||
                           document.querySelector('.contents') ||
                           document.querySelector('main .container');

          if (mainContent) {
            // Get all h2 and h3 headings with IDs
            var headings = mainContent.querySelectorAll('h2[id], h3[id]');
            console.log('vitalBayes: Found ' + headings.length + ' headings');

            if (headings.length >= 2) {
              // Try to find existing sidebar
              var sidebar = document.querySelector('.col-md-3.sidebar') ||
                           document.querySelector('aside.col-md-3') ||
                           document.querySelector('.col-md-3');

              // Create TOC container
              var tocContainer = document.createElement('div');
              tocContainer.id = 'home-toc-container';

              // Create header matching article TOC style
              var tocHeader = document.createElement('div');
              tocHeader.className = 'home-toc-header';
              tocHeader.textContent = 'On this page';
              tocContainer.appendChild(tocHeader);

              // Create navigation
              var nav = document.createElement('nav');
              nav.id = 'home-toc-nav';
              var ul = document.createElement('ul');
              ul.className = 'home-toc-list';

              var currentH2Li = null;
              var currentSubUl = null;

              headings.forEach(function(heading) {
                var text = heading.textContent.trim();
                if (!text) return;

                // Truncate long text
                if (text.length > 45) {
                  text = text.substring(0, 42) + '...';
                }

                var li = document.createElement('li');
                li.className = heading.tagName === 'H2' ? 'toc-h2' : 'toc-h3';

                var a = document.createElement('a');
                a.href = '#' + heading.id;
                a.className = 'toc-link';
                a.textContent = text;

                // Smooth scroll
                a.addEventListener('click', function(e) {
                  e.preventDefault();
                  var target = document.getElementById(heading.id);
                  if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    history.pushState(null, null, '#' + heading.id);
                  }
                });

                li.appendChild(a);

                if (heading.tagName === 'H2') {
                  ul.appendChild(li);
                  currentH2Li = li;
                  currentSubUl = null;
                } else if (heading.tagName === 'H3') {
                  if (currentH2Li) {
                    if (!currentSubUl) {
                      currentSubUl = document.createElement('ul');
                      currentSubUl.className = 'home-toc-sublist';
                      currentH2Li.appendChild(currentSubUl);
                    }
                    currentSubUl.appendChild(li);
                  } else {
                    ul.appendChild(li);
                  }
                }
              });

              nav.appendChild(ul);
              tocContainer.appendChild(nav);

              // Placement strategy: inject into sidebar or create fixed TOC
              if (sidebar) {
                console.log('vitalBayes: Injecting TOC into existing sidebar');
                sidebar.insertBefore(tocContainer, sidebar.firstChild);
              } else {
                console.log('vitalBayes: Creating fixed TOC (no sidebar found)');
                tocContainer.classList.add('home-toc-fixed');
                document.body.appendChild(tocContainer);
              }

              // Scroll spy functionality
              var tocLinks = tocContainer.querySelectorAll('.toc-link');
              var headingsArray = Array.from(headings);

              function updateActiveLink() {
                var scrollPos = window.scrollY + 150;
                var currentActive = null;

                headingsArray.forEach(function(heading) {
                  var rect = heading.getBoundingClientRect();
                  var absoluteTop = rect.top + window.scrollY;
                  if (absoluteTop <= scrollPos) {
                    currentActive = heading.id;
                  }
                });

                tocLinks.forEach(function(link) {
                  link.classList.remove('active');
                  if (currentActive && link.getAttribute('href') === '#' + currentActive) {
                    link.classList.add('active');
                  }
                });
              }

              var scrollTimeout;
              window.addEventListener('scroll', function() {
                if (scrollTimeout) window.cancelAnimationFrame(scrollTimeout);
                scrollTimeout = window.requestAnimationFrame(updateActiveLink);
              });

              updateActiveLink();
              console.log('vitalBayes: Homepage TOC created successfully');
            }
          }
        }

        // ===========================================
        // Make hex logo clickable to redirect to homepage
        // ===========================================
        var logos = document.querySelectorAll('img[src*="logo"], img.logo, .logo img');
        logos.forEach(function(logo) {
          if (logo.parentElement.tagName === 'A') {
            var parentLink = logo.parentElement;
            if (!parentLink.href || parentLink.href === '#' || parentLink.href.endsWith('#')) {
              var path = window.location.pathname;
              if (path.includes('/articles/') || path.includes('/reference/')) {
                parentLink.href = '../index.html';
              } else {
                parentLink.href = 'index.html';
              }
            }
            return;
          }

          logo.style.cursor = 'pointer';
          logo.addEventListener('click', function() {
            var path = window.location.pathname;
            if (path.includes('/articles/') || path.includes('/reference/')) {
              window.location.href = '../index.html';
            } else {
              window.location.href = 'index.html';
            }
          });
        });

        // ===========================================
        // Remove background from logo images
        // ===========================================
        logos.forEach(function(logo) {
          logo.style.background = 'transparent';
          logo.style.backgroundColor = 'transparent';
          logo.style.border = 'none';
          logo.style.boxShadow = 'none';
          if (logo.parentElement) {
            logo.parentElement.style.background = 'transparent';
            logo.parentElement.style.backgroundColor = 'transparent';
          }
        });

        // ===========================================
        // Fix copy button functionality
        // ===========================================
        document.querySelectorAll('.btn-copy, .copy-btn, button[data-clipboard-copy], .code-copy-button, [class*="copy"]').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            var codeBlock = this.closest('.sourceCode, .cell, pre, .highlight')?.querySelector('code, pre') ||
                            this.parentElement?.querySelector('code, pre') ||
                            this.closest('.sourceCode')?.querySelector('code');

            if (codeBlock) {
              var text = codeBlock.innerText || codeBlock.textContent;

              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                  var originalText = btn.innerHTML;
                  btn.innerHTML = '✓ Copied!';
                  btn.style.color = '#4ECDC4';
                  setTimeout(function() {
                    btn.innerHTML = originalText;
                    btn.style.color = '';
                  }, 2000);
                }).catch(function(err) {
                  fallbackCopy(text, btn);
                });
              } else {
                fallbackCopy(text, btn);
              }
            }
          });
        });

        function fallbackCopy(text, btn) {
          var textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            var originalText = btn.innerHTML;
            btn.innerHTML = '✓ Copied!';
            btn.style.color = '#4ECDC4';
            setTimeout(function() {
              btn.innerHTML = originalText;
              btn.style.color = '';
            }, 2000);
          } catch (err) {
            console.error('Copy failed:', err);
          }
          document.body.removeChild(textarea);
        }
      });
      </script>

